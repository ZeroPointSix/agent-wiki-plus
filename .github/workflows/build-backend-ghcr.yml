name: Build Backend Image (GHCR)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch current launcher artifact from production
        run: |
          set -euo pipefail
          mkdir -p backend/static/installers
          curl -fsSL -o backend/static/installers/AgentWikiLauncher.zip \
            https://agent-wiki.zerodotsixai.com/api/installer/binary
          test -s backend/static/installers/AgentWikiLauncher.zip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ZeroPointSix
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/zerodotsix/agent-wiki-backend:zer-1039-fix
          cache-from: type=gha
          cache-to: type=gha,mode=max

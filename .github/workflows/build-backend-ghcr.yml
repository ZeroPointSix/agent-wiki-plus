name: Build Backend Image (artifact)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch current launcher artifact from production
        run: |
          set -euo pipefail
          mkdir -p backend/static/installers
          curl -fsSL -o backend/static/installers/AgentWikiLauncher.zip \
            https://agent-wiki.zerodotsixai.com/api/installer/binary
          test -s backend/static/installers/AgentWikiLauncher.zip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: agent-wiki-backend:zer-1039-fix
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image tarball
        run: |
          docker save agent-wiki-backend:zer-1039-fix | gzip > /tmp/backend-image.tgz
          ls -lh /tmp/backend-image.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-zer1039
          path: /tmp/backend-image.tgz
          retention-days: 3
